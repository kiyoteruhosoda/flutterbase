name: Quality

# Runs the same gate as `./scripts/ci.sh` locally, so a green pull request
# means the checks passed with the rules in this repository — not a
# CI-only subset of them.
#
# The last job, `bump-version`, releases: on a push to main, and only after
# every other job here passed on that same commit, it bumps the version and
# pushes it — that push is what makes deck build and publish (ADR-0019,
# docs/RELEASE.md). On pull requests it only checks that it waits for every
# job. The manual bump stays in version_bump.yml.

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# 実行場所は **nolumialab のセルフホストランナー**（forge へ移したとき変えた）。
#
# ⚠ **`ubuntu-latest` をやめた理由は枠ではない。** このリポジトリは public なので
#   GitHub-hosted は無料だった。移したのは**正が forge になった**からで、
#   ミラーの上で走る CI は forge の PR に合否を返せない ——マージしてから
#   落ちる網になる。
#
# ⚠ **public × セルフホストの危険は forge 側では消えている。** 素性の知れない
#   fork から PR が来る筋が無い（登録を止めてあり、forge 側の写しは private）。
#   ⚠ **GitHub 側は public のまま**だが、そちらの workflow は消してある。
jobs:
  checks:
    runs-on: [self-hosted, nolumialab]
    timeout-minutes: 60
    # ⚠ **ジョブそのものをこのイメージの中で走らせる**（forge へ移したとき変えた）。
    #   GitHub では `setup-java` ＋ `flutter-action` で毎回 SDK を取り直していたが、
    #   act_runner では `container:` が使えるので、**リリースと同じビルダーを
    #   digest で継いだ台**をそのまま使う。取り直しが消えるぶん速く、
    #   何より**リリースと同じ SDK で検査される**。
    # ⚠ **タグではなく digest で固定する。** Flutter / Android SDK の版が動くと
    #   `pubspec.lock` がその SDK で解決できなくなり、`--enforce-lockfile` が
    #   落ちる。上げるときは `pubspec.yaml` の `environment:` と揃えること。
    #   いま入っているのは **Flutter 3.47.1 / OpenJDK 21**（実測。task #689 で 17 から上げた）で、
    #   `environment: flutter: ">=3.47.1"` と一致している。
    # ⚠ **`setup-java` は要らないが、`java` は PATH に居ない。**
    #   `JAVA_HOME=/opt/java/openjdk` は設定済みで Gradle はそこから見つけるが、
    #   `java` を直に呼ぶ道具を足すときは PATH を自分で通すこと。
    # ⚠ **キャッシュは `actions/cache` ではなく名前付きボリューム。**
    #   act_runner のキャッシュ置き場はランナーのコンテナの IP で待っており、
    #   ジョブのコンテナからは経路が無い（他のリポジトリで実測）。
    #   台の `valid_volumes` が `flutter-pub-cache` と `flutter-gradle-cache-*`
    #   を許している。
    container:
      image: hub.nolumia.com:5000/builder/ci-flutter@sha256:c613b975c5242a60abd7c159688159788ac2b9c6f8339f10f4ce928dbac483b9
      options: >-
        -v flutter-pub-cache:/cache/pub
        -v flutter-gradle-cache-flutterbase-ci:/cache/gradle
    env:
      PUB_CACHE: /cache/pub
      GRADLE_USER_HOME: /cache/gradle
    steps:
      - uses: actions/checkout@v5

      - name: Run the quality gate
        run: ./scripts/ci.sh

      # ⚠ **v7 を使わない。** act_runner では v4 以降が
      #   `GHESNotSupportedError` を**警告として出したまま緑で終わり、
      #   成果物が 1 つも上がらない**（2026-09-10 に実測）。
      #   ⚠ 壊れたことに気付けないので、必ずこのタグで固定する。
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v3.2.2-node20
        with:
          name: coverage
          path: coverage/lcov.info
          retention-days: 14
          if-no-files-found: ignore

  # ── 版上げ（＝配布）。task #994・ADR-0019 ──────────────────────────────────
  # ⚠ **上の検査が全部緑のときだけ走る。** 以前は version_bump.yml が push で
  #   Quality と並んで走り、試験が赤でも版が上がって deck が配った（2026-11-12
  #   AutoRule 1.33.0）。forge（Forgejo 15）に workflow_run は頼らず、同じ run の
  #   needs で繋ぐ ——同じ commit の結果だけを見る。
  # ⚠ **このファイルにジョブを足したら needs にも足す。** 足し忘れると、そのジョブが
  #   赤でも配られる。PR でも下の検査（check_bump_waits_for_quality.py）が落とす。
  # ⚠ 自分の版上げの push（actions-push）で起きた run では何もしない。
  bump-version:
    name: 版上げ（main への push で、上の検査が全部緑のときだけ）
    needs: [checks]
    if: success() && github.actor != 'actions-push'
    runs-on: [self-hosted, nolumialab]
    # git と bash と python3 だけを使うので軽い台でよい（node は checkout が要る）。
    container:
      image: hub.nolumia.com:5000/builder/ci-python311@sha256:da68dafef0d3aff23c1abf1bc4e9d43d8a16f87b8511a637198547c6509744cf
    timeout-minutes: 20
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          # ⚠ GITHUB_TOKEN では保護された main へ push できない（forgejo/forgejo#11159）。
          #   main への push のときだけ actions-push のトークン（kyon の Actions の秘密）で取る。
          token: ${{ (github.event_name == 'push' && github.ref == 'refs/heads/main') && secrets.PUSH_TOKEN || github.token }}

      - name: This job waits for every Quality job
        run: python3 scripts/check_bump_waits_for_quality.py

      # ⚠ CI の設定（.forgejo/）だけの push では版を上げない（2026-10-25 からの決まり。
      #   台の像の digest は週次の作り直しが上げるので、上げると毎週配り直される）。
      #   以前の version_bump.yml の paths-ignore と同じ判定をここでする。変えた道が全部
      #   NO_RELEASE_PATHS（拡張正規表現）に当たれば上げない。派生はここに足してよい。
      - name: Decide whether this push releases
        id: decide
        env:
          NO_RELEASE_PATHS: '^\.forgejo/'
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
        run: |
          if [ "$EVENT" != push ] || [ "$REF" != refs/heads/main ]; then
            echo "Not a push to main ($EVENT $REF); no release."
            echo "bump=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ -z "$BEFORE" ] || [ -z "${BEFORE//0/}" ] \
             || ! changed="$(git diff --name-only "$BEFORE" "$AFTER")"; then
            echo "No usable previous commit ($BEFORE); releasing."
            echo "bump=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "Changed files:"
          printf '%s\n' "$changed"
          if [ -z "$(printf '%s\n' "$changed" | grep -Ev "$NO_RELEASE_PATHS" || true)" ]; then
            echo "Every change matches $NO_RELEASE_PATHS; no release."
            echo "bump=false" >> "$GITHUB_OUTPUT"
          else
            echo "bump=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Bump the version and push (deck publishes on this push)
        if: steps.decide.outputs.bump == 'true'
        run: bash scripts/release_version_bump.sh auto
