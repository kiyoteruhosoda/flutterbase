name: Quality

# Runs the same gate as `./scripts/ci.sh` locally, so a green pull request
# means the checks passed with the rules in this repository — not a
# CI-only subset of them.
#
# The last job, `bump-version`, releases: on a push to main, and only after
# every other job here passed on that same commit, it bumps the version and
# pushes it — that push is what makes deck build and publish (ADR-0019,
# docs/RELEASE.md). On pull requests it only checks that it waits for every
# job. The manual bump stays in version_bump.yml.

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# Runs on the **nolumialab self-hosted runner** (changed when moving to forge).
#
# ⚠ **`ubuntu-latest` was not dropped over quota.** This repository is public, so
#   GitHub-hosted runners were free. It moved because **forge became the source of truth**:
#   CI running on the mirror cannot report results to forge PRs -- it would be a net
#   that only catches failures after merging.
#
# ⚠ **The public x self-hosted risk is gone on the forge side.** There is no path for
#   PRs from unknown forks (sign-up is closed and the forge copy is private).
#   ⚠ **The GitHub copy is still public**, but its workflows have been removed.
jobs:
  checks:
    runs-on: [self-hosted, nolumialab]
    timeout-minutes: 60
    # ⚠ **The job itself runs inside this image** (changed when moving to forge).
    #   On GitHub, `setup-java` + `flutter-action` re-fetched the SDK every time, but
    #   act_runner supports `container:`, so we use **an image built on the release
    #   builder by digest** as is. Skipping the re-fetch makes it faster and, above all,
    #   **checks run with the same SDK as the release**.
    # ⚠ **Pin by digest, not tag.** If the Flutter / Android SDK version moves,
    #   `pubspec.lock` may no longer resolve with that SDK and `--enforce-lockfile`
    #   fails. When bumping, keep `environment:` in `pubspec.yaml` in step.
    #   It currently ships **Flutter 3.47.1 / OpenJDK 21** (measured; raised from 17 in task #689),
    #   matching `environment: flutter: ">=3.47.1"`.
    # ⚠ **`setup-java` is not needed, but `java` is not on PATH.**
    #   `JAVA_HOME=/opt/java/openjdk` is set and Gradle finds it there, but
    #   when adding a tool that calls `java` directly, put it on PATH yourself.
    # ⚠ **The cache is a named volume, not `actions/cache`.**
    #   act_runner's cache server listens on the runner container's IP, which
    #   the job container has no route to (measured in another repository).
    #   The runner's `valid_volumes` allows `flutter-pub-cache` and `flutter-gradle-cache-*`.
    container:
      image: hub.nolumia.com:5000/builder/ci-flutter@sha256:c613b975c5242a60abd7c159688159788ac2b9c6f8339f10f4ce928dbac483b9
      options: >-
        -v flutter-pub-cache:/cache/pub
        -v flutter-gradle-cache-flutterbase-ci:/cache/gradle
    env:
      PUB_CACHE: /cache/pub
      GRADLE_USER_HOME: /cache/gradle
    steps:
      - uses: actions/checkout@v5

      - name: Run the quality gate
        run: ./scripts/ci.sh

      # ⚠ **Do not use v7.** On act_runner, v4 and later **print `GHESNotSupportedError`
      #   as a warning, finish green, and upload no artifacts at all** (measured 2026-09-10).
      #   ⚠ The breakage is invisible, so always pin to this tag.
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v3.2.2-node20
        with:
          name: coverage
          path: coverage/lcov.info
          retention-days: 14
          if-no-files-found: ignore

  # ── Version bump (= release). task #994, ADR-0019 ──────────────────────────
  # ⚠ **Runs only when every check above is green.** version_bump.yml used to run on
  #   push alongside Quality, so the version went up and deck released even with red
  #   tests (2026-11-12, AutoRule 1.33.0). Rather than relying on workflow_run in forge
  #   (Forgejo 15), chain with needs in the same run -- only this commit's results count.
  # ⚠ **When adding a job to this file, add it to needs too.** Otherwise a red result
  #   in that job still releases. The check below (check_bump_waits_for_quality.py) fails PRs that forget.
  # ⚠ Runs triggered by our own bump push (actions-push) do nothing.
  bump-version:
    name: Version bump (on push to main, only when every check above is green)
    needs: [checks]
    if: success() && github.actor != 'actions-push'
    runs-on: [self-hosted, nolumialab]
    # Uses only git, bash and python3, so the light image is enough (node is needed by checkout).
    container:
      image: hub.nolumia.com:5000/builder/ci-python311@sha256:da68dafef0d3aff23c1abf1bc4e9d43d8a16f87b8511a637198547c6509744cf
    timeout-minutes: 20
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          # ⚠ GITHUB_TOKEN cannot push to the protected main (forgejo/forgejo#11159).
          #   Only on a push to main, check out with the actions-push token (kyon's Actions secret).
          token: ${{ (github.event_name == 'push' && github.ref == 'refs/heads/main') && secrets.PUSH_TOKEN || github.token }}

      - name: This job waits for every Quality job
        run: python3 scripts/check_bump_waits_for_quality.py

      # ⚠ A push that only touches CI settings (.forgejo/) does not bump (rule since 2026-10-25:
      #   the weekly rebuild bumps the runner image digests, so bumping would re-release every week).
      #   ⚠ **Compare against the last release tag, not the previous push.** Comparing with the
      #   previous push leaves changes from cancelled or red runs unreleased after a later
      #   .forgejo/-only push (measured in a trial repository). Bump if anything changed since
      #   the last release outside NO_RELEASE_PATHS (extended regex). Derived apps may add paths here.
      - name: Decide whether this push releases
        id: decide
        env:
          NO_RELEASE_PATHS: '^\.forgejo/'
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
        run: |
          if [ "$EVENT" != push ] || [ "$REF" != refs/heads/main ]; then
            echo "Not a push to main ($EVENT $REF); no release."
            echo "bump=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Same tag lookup as scripts/bump_version.sh.
          last_tag="$(git tag --list 'v[0-9]*' --sort=-v:refname | head -1)"
          if [ -z "$last_tag" ]; then
            echo "No version tag yet; releasing."
            echo "bump=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          changed="$(git diff --name-only "$last_tag" HEAD)"
          echo "Changed since $last_tag:"
          printf '%s\n' "$changed"
          if [ -z "$(printf '%s\n' "$changed" | grep -Ev "$NO_RELEASE_PATHS" | grep -v '^$' || true)" ]; then
            echo "Nothing outside $NO_RELEASE_PATHS changed since $last_tag; no release."
            echo "bump=false" >> "$GITHUB_OUTPUT"
          else
            echo "bump=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Bump the version and push (deck publishes on this push)
        if: steps.decide.outputs.bump == 'true'
        run: bash scripts/release_version_bump.sh auto
