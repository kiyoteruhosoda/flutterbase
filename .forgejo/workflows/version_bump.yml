name: Version Bump

# ⚠ **Manual version bumps only.** The bump (= release) on a push to main is done by
#   the last job of quality.yml, `bump-version`, only when every check on the same
#   commit is green (task #994, ADR-0019). This used to run on push alongside Quality,
#   and releases went out even with red tests. Do not bring the push trigger back here.
on:
  workflow_dispatch:
    inputs:
      bump_type:
        description: "Version bump type"
        required: true
        default: auto
        type: choice
        options:
          - auto
          - major
          - minor
          - patch

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: write

# Runs on the nolumialab self-hosted runner (changed when moving to forge).
jobs:
  bump-version:
    runs-on: [self-hosted, nolumialab]
    # ⚠ **The job image needs node.** JS actions in `uses:` call node inside
    #   the job container -- a plain python image fails right at checkout with
    #   `exec: "node": executable file not found`.
    #   This job only uses git and bash, so the lighter image is enough.
    container:
      image: hub.nolumia.com:5000/builder/ci-python311@sha256:da68dafef0d3aff23c1abf1bc4e9d43d8a16f87b8511a637198547c6509744cf
    # ⚠ The default is 6 hours. A hung job would eat the runner, so set a ceiling.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          # ⚠ **GITHUB_TOKEN cannot push to the protected main.** forge's pre-receive
          #   cannot look up the Actions pseudo user (uid -2) and returns 500
          #   (an unresolved upstream bug, forgejo/forgejo#11159). Check out and push with
          #   the token of the real user actions-push (kyon's Actions secret).
          token: ${{ secrets.PUSH_TOKEN }}

      - name: Bump the version and push (deck publishes on this push)
        run: bash scripts/release_version_bump.sh "${{ inputs.bump_type }}"
