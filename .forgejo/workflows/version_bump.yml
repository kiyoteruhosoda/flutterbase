name: Version Bump

# ⚠ **手動の版上げだけ。** main への push での版上げ（＝配布）は quality.yml の
#   最後のジョブ `bump-version` が、同じ commit の検査が全部緑のときだけ行う
#   （task #994・ADR-0019）。以前はここが push で Quality と並んで走り、試験が
#   赤でも配られた。push の引き金をここへ戻さない。
on:
  workflow_dispatch:
    inputs:
      bump_type:
        description: "Version bump type"
        required: true
        default: auto
        type: choice
        options:
          - auto
          - major
          - minor
          - patch

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: write

# 実行場所は nolumialab のセルフホストランナー（forge へ移したとき変えた）。
jobs:
  bump-version:
    runs-on: [self-hosted, nolumialab]
    # ⚠ **ジョブのイメージに node が要る。** `uses:` の JS アクションは
    #   ジョブのコンテナの中の node を呼ぶ ——素の python イメージだと
    #   `exec: "node": executable file not found` で checkout から落ちる。
    #   この関門は git と bash しか使わないので、軽いほうの台でよい。
    container:
      image: hub.nolumia.com:5000/builder/ci-python311@sha256:da68dafef0d3aff23c1abf1bc4e9d43d8a16f87b8511a637198547c6509744cf
    # ⚠ 既定は 6 時間。ぶら下がったジョブが台を食い潰すので上限を置く。
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          # ⚠ **GITHUB_TOKEN では保護された main へ push できない。** forge の
          #   pre-receive が Actions の仮の利用者（uid -2）を引けずに 500 を返す
          #   （上流の未解決の不具合 forgejo/forgejo#11159）。実在の利用者
          #   actions-push のトークン（kyon の Actions の秘密）で checkout して押す。
          token: ${{ secrets.PUSH_TOKEN }}

      - name: Bump the version and push (deck publishes on this push)
        run: bash scripts/release_version_bump.sh "${{ inputs.bump_type }}"
