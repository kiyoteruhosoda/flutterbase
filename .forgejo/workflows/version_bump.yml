name: Version Bump

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      bump_type:
        description: "Version bump type"
        required: true
        default: auto
        type: choice
        options:
          - auto
          - major
          - minor
          - patch

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: write

# 実行場所は nolumialab のセルフホストランナー（forge へ移したとき変えた）。
jobs:
  bump-version:
    runs-on: [self-hosted, nolumialab]
    # ⚠ **ジョブのイメージに node が要る。** `uses:` の JS アクションは
    #   ジョブのコンテナの中の node を呼ぶ ——素の python イメージだと
    #   `exec: "node": executable file not found` で checkout から落ちる。
    #   この関門は git と bash しか使わないので、軽いほうの台でよい。
    container:
      image: hub.nolumia.com:5000/builder/ci-python311@sha256:c6db7656b1a48195fde17e0c25c2f9e2d01dae78f09df73a74dcb1a24da53b45
    # ⚠ 既定は 6 時間。ぶら下がったジョブが台を食い潰すので上限を置く。
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure git
        run: |
          git config user.name "forge-actions[bot]"
          git config user.email "forge-actions[bot]@nolumia.com"

      - name: Resolve bump type
        id: bump-type
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "value=${{ inputs.bump_type }}" >> "$GITHUB_OUTPUT"
          else
            echo "value=auto" >> "$GITHUB_OUTPUT"
          fi

      - name: Bump version
        id: bump
        run: bash scripts/bump_version.sh "${{ steps.bump-type.outputs.value }}"

      - name: Create version tag
        if: steps.bump.outputs.new_version != ''
        run: |
          VERSION="v${{ steps.bump.outputs.new_version }}"
          git add pubspec.yaml
          git commit -m "chore: bump version to ${{ steps.bump.outputs.new_version_full }}"
          if git rev-parse "refs/tags/$VERSION" >/dev/null 2>&1; then
            echo "Tag $VERSION already exists, skipping tag creation."
            git push origin main
          else
            git tag "$VERSION"
            git push origin main --tags
          fi
