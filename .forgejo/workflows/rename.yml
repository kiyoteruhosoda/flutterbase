name: Rename

# Checks, on the template side, that an app derived with the template's
# `scripts/rename_app.sh` **passes Quality on its main right after creation** (task #169).
#
# deck's project creation (android type) stacks one rename_app.sh commit on top of
# the template's history and pushes it to a new repository. When wbstimer was created
# on 2026-10-01 its main was red (import order, the default package name in the design
# check, assetlinks.json). The template's CI only runs under the template's own name,
# so a broken rename went unnoticed in the template.
#
# ⚠ **Rename the same way deck does**: run rename_app.sh with a temporary name,
#   `git add --all` and commit, then run the same `./scripts/ci.sh` as Quality.
# ⚠ **rename_app.sh deletes this file in a derived app** (there is nothing to rename there).
#   If it comes back when a derived app pulls in template fixes, the check below does nothing.

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: rename-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  renamed:
    runs-on: [self-hosted, nolumialab]
    timeout-minutes: 60
    # Same runner image as quality.yml (the reasons are written there).
    # ⚠ **Keep the Gradle cache separate from quality.yml.** Both run at once on the same PR;
    #   sharing it makes them fight over `journal-1.lock` and the release build fails
    #   (across containers the PID is invisible, so the owner never hands it over. Seen 2026-10-01).
    container:
      image: hub.nolumia.com:5000/builder/ci-flutter@sha256:c613b975c5242a60abd7c159688159788ac2b9c6f8339f10f4ce928dbac483b9
      options: >-
        -v flutter-pub-cache:/cache/pub
        -v flutter-gradle-cache-flutterbase-rename:/cache/gradle
    env:
      PUB_CACHE: /cache/pub
      GRADLE_USER_HOME: /cache/gradle
      TRIAL_DART_NAME: renametrial
      TRIAL_ANDROID_PKG: com.nolumia.renametrial
    steps:
      - uses: actions/checkout@v5

      - name: Is this the template?
        id: template
        run: |
          name="$(awk '/^name:/ {print $2; exit}' pubspec.yaml)"
          if [ "$name" = flutterbase ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "pubspec name is $name -- not the template, nothing to do."
          fi

      - name: Rename the way deck's project creation does
        if: steps.template.outputs.run == 'true'
        run: |
          bash scripts/rename_app.sh "$TRIAL_DART_NAME" "$TRIAL_ANDROID_PKG"
          git add --all
          git -c user.name=rename-check -c user.email=rename-check@nolumia.com \
            commit --quiet -m "rename to $TRIAL_DART_NAME"
          git show --stat --format='%s' HEAD | tail -5

      - name: Nothing of the template's name is left
        if: steps.template.outputs.run == 'true'
        run: |
          if git grep -n -e 'package:flutterbase/' -e 'com\.nolumia\.flutterbase' \
               -- ':!docs/CHANGELOG.md' ':!scripts/rename_app.sh'; then
            echo "Some names were not replaced (lines above). Fix scripts/rename_app.sh." >&2
            exit 1
          fi

      - name: Run the quality gate on the renamed app
        if: steps.template.outputs.run == 'true'
        run: ./scripts/ci.sh
