name: Quality

# Runs the same gate as `./scripts/ci.sh` locally, so a green pull request
# means the checks passed with the rules in this repository — not a
# CI-only subset of them.
#
# This workflow is read-only: it does not tag, bump, publish, or merge.
# Release automation stays in version_bump.yml and, for the artifacts
# themselves, off GitHub entirely — see docs/RELEASE.md.

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    # The last check in scripts/ci.sh builds the release APK and AAB the way
    # the release pipeline does (see docs/RELEASE.md), which is slower than the
    # debug build that used to be there — and slower again whenever the Gradle
    # cache below misses.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          # Pinned, not floating: `pubspec.lock` is only valid for the exact
          # SDK that resolved it, because Flutter pins its own vendored
          # packages. Keep in sync with the `environment:` block in
          # pubspec.yaml and with the Flutter inside the release builder
          # image — see docs/OPERATIONS.md.
          flutter-version: "3.47.1"
          channel: stable
          cache: true

      - name: Cache Gradle
        uses: actions/cache@v6
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('android/**/*.gradle*', 'android/**/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Run the quality gate
        run: ./scripts/ci.sh

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: coverage/lcov.info
          retention-days: 14
          if-no-files-found: ignore
