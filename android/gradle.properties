org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8
org.gradle.daemon=false
org.gradle.parallel=false
org.gradle.workers.max=1
kotlin.daemon.jvm.options=-Xmx1536m -XX:MaxMetaspaceSize=512m
org.gradle.caching=true
android.useAndroidX=true
# Built-in Kotlin stays off: AGP 9.1's embedded Kotlin is 2.2.10, below
# Flutter's minimum of 2.2.20, so enabling it fails the Flutter Gradle
# plugin outright. Flutter's own 3.47 template ships this as false too.
android.builtInKotlin=false
# This newDsl flag was added automatically by Flutter migrator
android.newDsl=false
